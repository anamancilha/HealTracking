<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Resíduos</title>
    <!-- Bootstrap 5 CSS via CDN oficial -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
            <h2 class="mb-0">Tipos de Resíduos Hospitalares</h2>
            <a href="/tipos/novo" class="btn btn-light text-success fw-bold">+ Novo Tipo</a>
        </div>
        <div class="card-body">
            <p class="lead">Esta página lista as classificações de resíduos cadastradas no sistema.</p>

            <!-- Tabela Dinâmica do Thymeleaf -->
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nome do Tipo / Descrição</th>
                        <th>Grupo de Classificação (ANVISA)</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Se a lista estiver vazia -->
                    <tr th:if="${#lists.isEmpty(tipos)}">
                        <td colspan="4" class="text-center text-muted py-4">Nenhum tipo de resíduo cadastrado ainda.</td>
                    </tr>
                    <!-- Loop pelos registros do banco -->
                    <tr th:each="t : ${tipos}">
                        <td th:text="${t.idTipoResiduo}">1</td>
                        <td th:text="${t.nomeTipo}">Infecciosos</td>
                        <td th:text="${t.grupoClassificacao}">Grupo A</td>
                        <td class="text-end">
                            <a th:href="@{/tipos/editar/{id}(id=${t.idTipoResiduo})}" class="btn btn-sm btn-warning">Editar</a>
                            <a th:href="@{/tipos/excluir/{id}(id=${t.idTipoResiduo})}" class="btn btn-sm btn-danger">Excluir</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-3">
                <a href="/" class="btn btn-secondary">Voltar ao Início</a>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
