<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - HealTracking</title>
    <!-- Bootstrap 5 CSS via CDN oficial -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="container" style="max-width: 400px;">
    <div class="card shadow">
        <div class="card-header bg-success text-white text-center py-3">
            <h3 class="mb-0">HealTracking</h3>
            <small>Acesso ao Sistema</small>
        </div>
        <div class="card-body p-4">

            <!-- Mensagem de erro de autenticação -->
            <div th:if="${param.error}" class="alert alert-danger text-center" role="alert">
                E-mail ou palavra-passe incorretos.
            </div>

            <!-- Mensagem de saída bem-sucedida -->
            <div th:if="${param.logout}" class="alert alert-success text-center" role="alert">
                Sessão terminada com sucesso.
            </div>

            <form th:action="@{/login}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">E-mail</label>
                    <input type="email" id="username" name="username" class="form-control" placeholder="seu@email.com" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Palavra-passe</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Sua palavra-passe" required>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-success">Entrar</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <a href="/usuarios/novo" class="text-decoration-none text-success fw-semibold">Primeiro acesso? Cadastre-se aqui</a>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
