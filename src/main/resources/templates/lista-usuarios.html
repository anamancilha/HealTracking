<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Utilizadores - HealTracking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestão de Utilizadores</h2>
        <div>
            <a th:href="@{/}" class="btn btn-outline-secondary me-2">Início</a>
            <a th:href="@{/usuarios/novo}" class="btn btn-primary">Novo Utilizador</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Perfil</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.idUsuario}"></td>
                    <td th:text="${u.nome}"></td>
                    <td th:text="${u.email}"></td>
                    <td>
                        <span class="badge" th:classappend="${u.perfil == 'ADMIN'} ? 'bg-danger' : 'bg-secondary'" th:text="${u.perfil}"></span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/usuarios/editar/{id}(id=${u.idUsuario})}" class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{/usuarios/excluir/{id}(id=${u.idUsuario})}" class="btn btn-sm btn-danger" onclick="return confirm('Tens a certeza?')">Excluir</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="5" class="text-center text-muted py-4">Nenhum utilizador registado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
