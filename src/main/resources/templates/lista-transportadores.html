<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Transportadores - HealTracking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestão de Transportadores</h2>
        <div>
            <a th:href="@{/coletas}" class="btn btn-outline-secondary me-2">Ver Coletas</a>
            <a th:href="@{/transportadores/novo}" class="btn btn-primary">Novo Transportador</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Representante</th>
                        <th>Empresa (Razão Social)</th>
                        <th>CNPJ</th>
                        <th>Licença</th>
                        <th>Telefone</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="t : ${transportadores}">
                        <td th:text="${t.idTransportador}"></td>
                        <td th:text="${t.nomeRepresentante}"></td>
                        <td th:text="${t.nomeEmpresa}"></td>
                        <td th:text="${t.cnpj}"></td>
                        <td th:text="${t.numeroLicenca}"></td>
                        <td th:text="${t.telefone}"></td>
                        <td class="text-end">
                            <a th:href="@{/transportadores/editar/{id}(id=${t.idTransportador})}" class="btn btn-sm btn-warning">Editar</a>
                            <a th:href="@{/transportadores/excluir/{id}(id=${t.idTransportador})}" class="btn btn-sm btn-danger" onclick="return confirm('Tens a certeza?')">Excluir</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(transportadores)}">
                        <td colspan="7" class="text-center text-muted py-4">Nenhum transportador registado.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
