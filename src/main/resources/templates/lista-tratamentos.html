<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tratamentos - HealTracking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestão de Locais de Tratamento</h2>
        <div>
            <a th:href="@{/coletas}" class="btn btn-outline-secondary me-2">Ver Coletas</a>
            <a th:href="@{/tratamentos/novo}" class="btn btn-primary">Novo Tratamento</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome do Local</th>
                    <th>Endereço</th>
                    <th>Telefone</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tr : ${tratamentos}">
                    <td th:text="${tr.idTratamento}"></td>
                    <td th:text="${tr.nomeLocal}"></td>
                    <td th:text="${tr.endereco}"></td>
                    <td th:text="${tr.telefone}"></td>
                    <td class="text-end">
                        <a th:href="@{/tratamentos/editar/{id}(id=${tr.idTratamento})}" class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{/tratamentos/excluir/{id}(id=${tr.idTratamento})}" class="btn btn-sm btn-danger" onclick="return confirm('Tens a certeza?')">Excluir</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tratamentos)}">
                    <td colspan="5" class="text-center text-muted py-4">Nenhum local de tratamento registado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
