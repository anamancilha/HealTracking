<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registo de Utilizador - HealTracking</title>
    <!-- Bootstrap 5 CSS via CDN oficial -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="container" style="max-width: 450px;">
    <div class="card shadow">
        <div class="card-header bg-success text-white text-center py-3">
            <h3 class="mb-0">HealTracking</h3>
            <small>Registo de Novo Utilizador</small>
        </div>
        <div class="card-body p-4">

            <form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="POST">
                <!-- Campo oculto para suportar edição futura -->
                <input type="hidden" th:field="*{idUsuario}" />

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome Completo</label>
                    <input type="text" id="nome" th:field="*{nome}" class="form-control" placeholder="Seu nome completo" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="seu@email.com" required>
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">Palavra-passe</label>
                    <input type="password" id="senha" th:field="*{senha}" class="form-control" placeholder="Crie uma palavra-passe" required>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-success">Registar Utilizador</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <a href="/login" class="text-decoration-none text-secondary">Já tem uma conta? Faça login</a>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
