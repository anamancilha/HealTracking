<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registo de Resíduo - HealTracking</title>
    <!-- Bootstrap 5 CSS via CDN oficial -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h3 class="mb-0">Registar Novo Resíduo</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/residuos/salvar}" th:object="${residuo}" method="POST">

                <!-- Campo oculto para suportar edição -->
                <input type="hidden" th:field="*{idResiduo}" />

                <div class="mb-3">
                    <label for="pesoKg" class="form-label">Peso (kg)</label>
                    <input type="number" step="0.01" id="pesoKg" th:field="*{pesoKg}" class="form-control" placeholder="0.00" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="dataGeracao" class="form-label">Data de Geração</label>
                    <input type="date" id="dataGeracao" th:field="*{dataGeracao}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="tipoResiduo" class="form-label">Tipo de Resíduo (Classificação)</label>
                    <select id="tipoResiduo" th:field="*{tipoResiduo}" class="form-select" required>
                        <option value="">Selecione a classificação...</option>
                        <option th:each="t : ${tipos}" th:value="${t.idTipoResiduo}" th:text="${t.nomeTipo} + ' (' + ${t.grupoClassificacao} + ')'"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="gerador" class="form-label">Estabelecimento Gerador</label>
                    <select id="gerador" th:field="*{gerador}" class="form-select" required>
                        <option value="">Selecione o gerador...</option>
                        <option th:each="g : ${geradores}" th:value="${g.idGerador}" th:text="${g.razaoSocial}"></option>
                    </select>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/residuos" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Salvar Resíduo</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
