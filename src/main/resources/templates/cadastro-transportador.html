<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registar Transportador - HealTracking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">Registar Transportador</h2>
                    <!-- Alerta de Erro (Pop-up visual) -->
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/transportadores/salvar}" th:object="${transportador}" method="post">
                        <input type="hidden" th:field="*{idTransportador}">

                        <div class="mb-3">
                            <label for="nomeRepresentante" class="form-label">Nome do Representante:</label>
                            <input type="text" id="nomeRepresentante" th:field="*{nomeRepresentante}" class="form-control" placeholder="Ex: Carlos Silva" required>
                        </div>

                        <div class="mb-3">
                            <label for="nomeEmpresa" class="form-label">Nome da Empresa (Razão Social):</label>
                            <input type="text" id="nomeEmpresa" th:field="*{nomeEmpresa}" class="form-control" placeholder="Ex: EcoTransportes Lda." required>
                        </div>

                        <div class="mb-3">
                            <label for="cnpj" class="form-label">CNPJ:</label>
                            <input type="text" id="cnpj" th:field="*{cnpj}" class="form-control" placeholder="00.000.000/0001-00" required>
                        </div>

                        <div class="mb-3">
                            <label for="numeroLicenca" class="form-label">Número de Licença:</label>
                            <input type="text" id="numeroLicenca" th:field="*{numeroLicenca}" class="form-control" placeholder="Ex: LIC-2026-001" required>
                        </div>

                        <div class="mb-3">
                            <label for="telefone" class="form-label">Telefone:</label>
                            <input type="text" id="telefone" th:field="*{telefone}" class="form-control" placeholder="(00) 00000-0000" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">Salvar Transportador</button>
                            <a th:href="@{/transportadores}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
