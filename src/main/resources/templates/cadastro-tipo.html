<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Tipo de Resíduo</title>
    <!-- Bootstrap 5 CSS via CDN oficial -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow" style="max-width: 600px; margin: 0 auto;">
        <div class="card-header bg-success text-white">
            <h3 class="mb-0">Novo Tipo de Resíduo</h3>
        </div>
        <div class="card-body">
            <!-- O th:action aponta para o método POST do Controller -->
            <form th:action="@{/tipos/salvar}" th:object="${tipoResiduo}" method="POST">
                <input type="hidden" th:field="*{idTipoResiduo}" />

                <div class="mb-3">
                    <label for="nomeTipo" class="form-label">Nome do Tipo / Descrição</label>
                    <input type="text" id="nomeTipo" th:field="*{nomeTipo}" class="form-control" placeholder="Ex: Materiais Biológicos, Seringas, etc." required>
                </div>

                <div class="mb-3">
                    <label for="grupoClassificacao" class="form-label">Grupo de Classificação (ANVISA)</label>
                    <input type="text" id="grupoClassificacao" th:field="*{grupoClassificacao}" class="form-control" placeholder="Ex: Grupo A, Grupo B, Grupo E" required>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/tipos" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Salvar no Banco</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle (Opcional, mas ajuda na performance de componentes interativos) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
