<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Resíduos - HealTracking</title>
    <!-- Bootstrap 5 CSS via CDN oficial -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
            <h2 class="mb-0">Resíduos Hospitalares Registados</h2>
            <a href="/residuos/novo" class="btn btn-light text-success fw-bold">+ Novo Resíduo</a>
        </div>
        <div class="card-body">
            <p class="lead">Esta página lista todos os resíduos de serviços de saúde geridos no sistema.</p>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Peso (kg)</th>
                        <th>Data de Geração</th>
                        <th>Tipo / Grupo</th>
                        <th>Gerador</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(residuos)}">
                        <td colspan="6" class="text-center text-muted py-4">Nenhum resíduo registado ainda.</td>
                    </tr>
                    <tr th:each="r : ${residuos}">
                        <td th:text="${r.idResiduo}">1</td>
                        <td th:text="${r.pesoKg} + ' kg'">1.5 kg</td>
                        <td th:text="${r.dataGeracao}">2026-11-13</td>
                        <td th:text="${r.tipoResiduo != null ? r.tipoResiduo.nomeTipo + ' (' + r.tipoResiduo.grupoClassificacao + ')' : 'N/A'}">Grupo E</td>
                        <td th:text="${r.gerador != null ? r.gerador.razaoSocial : 'N/A'}">Hospital Exemplo</td>
                        <td class="text-end">
                            <a th:href="@{/residuos/editar/{id}(id=${r.idResiduo})}" class="btn btn-sm btn-warning">Editar</a>
                            <a th:href="@{/residuos/excluir/{id}(id=${r.idResiduo})}" class="btn btn-sm btn-danger">Excluir</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-3">
                <a href="/" class="btn btn-secondary">Voltar ao Início</a>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
