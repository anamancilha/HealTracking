<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Gerador - HealTracking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0 p-4">
        <h2 class="mb-4 text-success fw-bold">Cadastrar Novo Gerador</h2>

        <form th:action="@{/geradores/salvar}" th:object="${gerador}" method="post">
            <div class="mb-3">
                <label for="razaoSocial" class="form-label">Razão Social</label>
                <input type="text" id="razaoSocial" th:field="*{razaoSocial}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="tipoEstabelecimento" class="form-label">Tipo de Estabelecimento (Ex: Hospital, Clínica)</label>
                <input type="text" id="tipoEstabelecimento" th:field="*{tipoEstabelecimento}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="cnpj" class="form-label">CNPJ</label>
                <input type="text" id="cnpj" th:field="*{cnpj}" class="form-control" required>
            </div>

            <div class="d-flex justify-content-between">
                <a href="/" class="btn btn-secondary">Voltar ao Menu</a>
                <button type="submit" class="btn btn-success">Salvar Gerador</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
