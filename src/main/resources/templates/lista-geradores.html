<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Geradores - HealTracking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-success fw-bold">Geradores Cadastrados</h2>
        <div>
            <a href="/geradores/novo" class="btn btn-success">Novo Gerador</a>
            <a href="/" class="btn btn-outline-secondary">Menu Inicial</a>
        </div>
    </div>

    <div class="card shadow-sm border-0 p-3">
        <table class="table table-striped align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Razão Social</th>
                <th>Tipo</th>
                <th>CNPJ</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="g : ${geradores}">
                <td th:text="${g.idGerador}">1</td>
                <td th:text="${g.razaoSocial}">Nome Exemplo</td>
                <td th:text="${g.tipoEstabelecimento}">Hospital</td>
                <td th:text="${g.cnpj}">00.000.000/0001-00</td>
            </tr>
            <tr th:if="${#lists.isEmpty(geradores)}">
                <td colspan="4" class="text-center text-muted py-4">Nenhum gerador cadastrado ainda.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
