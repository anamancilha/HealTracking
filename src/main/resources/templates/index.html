<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealTracking - Gerenciamento de RSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">HealTracking</a>
    </div>
</nav>

<div class="container my-5">
    <div class="p-5 mb-4 bg-white rounded-3 shadow-sm border">
        <div class="container-fluid py-3">
            <h1 class="display-5 fw-bold text-success">HealTracking</h1>
            <p class="col-md-8 fs-4 text-muted">Sistema de Gerenciamento de Resíduos de Serviços de Saúde (RSS).</p>
            <hr class="my-4">
            <p class="fs-5">Selecione uma das opções abaixo para gerenciar o sistema:</p>

            <div class="row g-3 mt-3">
                <div class="col-md-3">
                    <a href="/tipos" class="btn btn-outline-primary w-100 p-3 fw-semibold">Lista de Resíduos</a>
                </div>
                <div class="col-md-3">
                    <a href="/tipos/novo" class="btn btn-primary w-100 p-3 fw-semibold">Cadastrar Resíduo</a>
                </div>
                <div class="col-md-3">
                    <a href="/geradores" class="btn btn-outline-success w-100 p-3 fw-semibold">Lista de Geradores</a>
                </div>
                <div class="col-md-3">
                    <a href="/geradores/novo" class="btn btn-success w-100 p-3 fw-semibold">Cadastrar Gerador</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
