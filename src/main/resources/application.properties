#Configurações de Conexão com o MySQL (variáveis na nuvem + fallback local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gerenciamento_residuos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

#Porta dinâmica na nuvem (8080 por padrão no local)
server.port=${PORT:8080}

#Configurações do Hibernate (JPA)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#Use validate ou update conforme o caso; na nuvem você pode controlar via DDL_AUTO
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

#Mostra no console todo o comando SQL que o Hibernate está gerando por debaixo dos panos
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true