#Configurações de Conexão com o MySQL do WampServer
spring.datasource.url=jdbc:mysql://localhost:3306/gerenciamento_residuos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=

#Configurações do Hibernate (JPA)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#"update" faz o Hibernate criar ou atualizar as tabelas sozinho ao rodar o Java
spring.jpa.hibernate.ddl-auto=update

#Mostra no console do VS Code todo o comando SQL que o Hibernate está gerando por debaixo dos panos
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

